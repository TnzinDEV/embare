{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>{% block title %}Embare-KRAFT{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'style.css' %}">

</head>
<nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary">

    <div class="container">

        <!-- LOGO -->
        <a class="navbar-brand fw-bold fs-4" href="{% url 'home' %}">
            TN<span class="text-danger">-</span>Keys
        </a>


        <!-- BOTÃO MENU MOBILE -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarPrincipal"
            aria-controls="navbarPrincipal" aria-expanded="false" aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>


        <!-- MENU -->
        <div class="collapse navbar-collapse" id="navbarPrincipal">

            <!-- LINKS -->
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'home' %}">
                        <i class="bi bi-house-door me-1"></i>
                        Início
                    </a>
                </li>


                <li class="nav-item">
                    <a class="nav-link" href="{% url 'jogo' %}">
                        <i class="bi bi-controller me-1"></i>
                        Jogos
                    </a>
                </li>


                <li class="nav-item">
                    <a class="nav-link" href="{% url 'sobre' %}">
                        <i class="bi bi-info-circle me-1"></i>
                        Sobre
                    </a>
                </li>

            </ul>


            <!-- ================= USUÁRIO ================= -->

            <div class="d-flex align-items-center gap-2">

                {% if user.is_authenticated %}

                <!-- PERFIL -->
                <a href="{% url 'perfil' %}" class="btn btn-outline-light btn-sm px-3">
                    <i class="bi bi-person-circle me-1"></i>
                    Olá, {{ user.username }}
                </a>


                <!-- SAIR -->
                <form method="post" action="{% url 'logout' %}" class="m-0">

                    {% csrf_token %}

                    <button type="submit" class="btn btn-danger btn-sm px-3">
                        <i class="bi bi-box-arrow-right me-1"></i>
                        Sair
                    </button>

                </form>


                {% else %}

                <!-- ENTRAR -->
                <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm px-3">
                    <i class="bi bi-box-arrow-in-right me-1"></i>
                    Entrar
                </a>


                <!-- CRIAR CONTA -->
                <a href="{% url 'cadastro' %}" class="btn btn-danger btn-sm px-3">
                    <i class="bi bi-person-plus me-1"></i>
                    Criar conta
                </a>

                {% endif %}

            </div>

        </div>

    </div>

</nav>
{% block content %}

{% endblock %}

</html>
